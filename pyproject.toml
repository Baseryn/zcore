[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fastapi-zcore-framework"
dynamic = ["version"]
description = "An opinionated architectural framework built on top of FastAPI that provides production-ready architecture, repository abstractions, scoped dependency injection, a secure dynamic query engine, and consistent transaction management."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache License 2.0" }
authors = [
    { name = "Ali Alf Ostovar", email = "240363843+alialfostovar@users.noreply.github.com" }
]
maintainers = [
    { name = "Baseryn" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "anyio>=4.3.0",
    "jsonschema>=4.21.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.22.0",
    "questionary>=2.0.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
db = [
    "sqlalchemy[asyncio]>=2.0.28",
    "aiosqlite>=0.20.0",
]
postgres = [
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
]
mysql = [
    "sqlalchemy[asyncio]>=2.0.28",
    "aiomysql>=0.2.0",
]
redis = [
    "redis>=5.0.3",
]
cache = [
    "redis>=5.0.3",
]
storage = [
    "aiofiles>=23.2.1",
]
crypto = [
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]
all = [
    "sqlalchemy[asyncio]>=2.0.28",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "redis>=5.0.3",
    "aiofiles>=23.2.1",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/Baseryn/zcore"
Repository = "https://github.com/Baseryn/zcore"
Documentation = "https://baseryn.github.io/zcore-docs/"
"Bug Tracker" = "https://github.com/Baseryn/zcore/issues"

[project.scripts]
zc = "zcore.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/zcore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.hatch.envs.hatch-test]
extra-dependencies = [
    "pytest-asyncio",
    "httpx"
]
features = [
    "all"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # Line too long (managed automatically by formatter)
    "B008",   # Do not perform function call Depends in argument defaults (FastAPI standard)
    "B024",   # Base class has no abstract methods
    "B039",   # ContextVar mutable default
    "B904",   # Use raise from in except clauses
    "BLE001", # Do not catch blind exception Exception
    "TRY201", # Use raise without specifying exception name
    "PYI036", # The argument in __aexit__ should be annotated
    "SIM102", # Nested if statements
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "example/"]